name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.26.x'
          - os: ubuntu-latest
            go: stable
          - os: macos-latest
            go: stable
          - os: windows-latest
            go: stable
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - run: go mod verify
      - name: Check reachable dependency and standard-library vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Fuzz the untrusted HiveMind frame parser
        run: go test -run '^$' -fuzz '^FuzzHiveBinaryFrame$' -fuzztime=60s ./...
